name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Compost.sln

      - name: Build
        run: dotnet build Compost.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Compost.sln --configuration Release --no-build --verbosity normal

      - name: Publish
        run: |
          dotnet publish src/Compost.Web/Compost.Web.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output ./publish \
            -p:PublishSingleFile=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compost-web-linux-x64
          path: ./publish
          retention-days: 30
