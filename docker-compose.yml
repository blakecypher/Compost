services:
  compost:
    build:
      context: .
      dockerfile: src/Compost.Web/Dockerfile
    ports:
      - "5055:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - OrchardCore__OrchardCore_Shells_Database__ConnectionString=Server=postgres;Port=5432;Database=compost;User Id=compost;Password=${POSTGRES_PASSWORD:-CompostPassword123!}
      - OrchardCore__OrchardCore_Shells_Database__DatabaseProvider=Postgres
      - OrchardCore__OrchardCore_Shells_Database__TablePrefix=
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - compost-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=compost
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CompostPassword123!}
      - POSTGRES_DB=compost
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - compost-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compost -d compost"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  compost-network:
    driver: bridge
